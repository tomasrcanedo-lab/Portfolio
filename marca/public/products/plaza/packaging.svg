      <text x="-96" y="40" font-family="ui-monospace, Menlo, monospace" font-size="40" letter-spacing="2" fill="#0A0A0A">Nº 01/50</text>
    </g>

<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#6B6B6B">
  <text x="48" y="1452">PLAZA // NEGRO — PACKAGING</text>
  <text x="1152" y="1452" text-anchor="end">PLACEHOLDER</text>
