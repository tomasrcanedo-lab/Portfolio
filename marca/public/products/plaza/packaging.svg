<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="PLAZA // NEGRO — PACKAGING">

<defs>
  <radialGradient id="studio-plaza-packaging" cx="50%" cy="42%" r="75%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9E9E6"/>
  </radialGradient>
  <linearGradient id="black-plaza-packaging" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2a2a"/>
    <stop offset=".35" stop-color="#0A0A0A"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="lens-plaza-packaging" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#262626"/>
    <stop offset=".5" stop-color="#0d0d0d"/>
    <stop offset="1" stop-color="#030303"/>
  </linearGradient>
  <linearGradient id="smoke-plaza-packaging" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4a48"/>
    <stop offset="1" stop-color="#1c1c1b"/>
  </linearGradient>
  <linearGradient id="mirror-plaza-packaging" x1="0" y1="0" x2=".2" y2="1">
    <stop offset="0" stop-color="#f7f7f5"/>
    <stop offset=".42" stop-color="#b9b9b6"/>
    <stop offset=".5" stop-color="#6d6d6a"/>
    <stop offset=".62" stop-color="#cfcfcb"/>
    <stop offset="1" stop-color="#8d8d89"/>
  </linearGradient>
  <linearGradient id="silver-plaza-packaging" x1="0" y1="0" x2="1" y2="1">
