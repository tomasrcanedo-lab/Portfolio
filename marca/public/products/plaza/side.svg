          <path d="M -392 -70 L -100 -70" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>
        <g transform="scale(-1,1)">
          <rect x="-448" y="-62" width="22" height="30" fill="#151515"/>
          <rect x="-418" y="-78" width="352" height="156" rx="10" fill="url(#lens-plaza-side)" stroke="url(#black-plaza-side)" stroke-width="40"/>
          <rect x="-462" y="-58" width="34" height="14" fill="url(#silver-plaza-side)"/>
          <path d="M -392 -70 L -100 -70" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>
        <path d="M -66 -46 Q 0 -60 66 -46" stroke="#0A0A0A" stroke-width="28" fill="none"/></g>
        <g transform="translate(320 -40) rotate(-4)"><path d="M 0 0 L 360 18 Q 420 22 440 70" stroke="url(#black-plaza-side)" stroke-width="26" fill="none" stroke-linecap="round"/><rect x="30" y="-6" width="60" height="14" fill="url(#silver-plaza-side)"/></g>
