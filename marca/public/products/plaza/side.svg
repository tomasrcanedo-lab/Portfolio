<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="PLAZA // NEGRO — 3/4">

<defs>
  <radialGradient id="studio-plaza-side" cx="50%" cy="42%" r="75%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9E9E6"/>
  </radialGradient>
  <linearGradient id="black-plaza-side" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2a2a"/>
    <stop offset=".35" stop-color="#0A0A0A"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="lens-plaza-side" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#262626"/>
    <stop offset=".5" stop-color="#0d0d0d"/>
    <stop offset="1" stop-color="#030303"/>
  </linearGradient>
  <linearGradient id="smoke-plaza-side" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4a48"/>
    <stop offset="1" stop-color="#1c1c1b"/>
  </linearGradient>
  <linearGradient id="mirror-plaza-side" x1="0" y1="0" x2=".2" y2="1">
    <stop offset="0" stop-color="#f7f7f5"/>
    <stop offset=".42" stop-color="#b9b9b6"/>
    <stop offset=".5" stop-color="#6d6d6a"/>
    <stop offset=".62" stop-color="#cfcfcb"/>
    <stop offset="1" stop-color="#8d8d89"/>
  </linearGradient>
  <linearGradient id="silver-plaza-side" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f4f2"/>
    <stop offset=".45" stop-color="#9c9c98"/>
    <stop offset=".6" stop-color="#e2e2df"/>
    <stop offset="1" stop-color="#7d7d79"/>
  </linearGradient>
  <filter id="soft-plaza-side" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="28"/>
  </filter>
  <filter id="grain-plaza-side" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/>
  </filter>
</defs>
<rect width="1200" height="1500" fill="url(#studio-plaza-side)"/>

      <ellipse cx="620" cy="880" rx="400" ry="30" fill="#000" opacity=".14" filter="url(#soft-plaza-side)"/>
      <g transform="translate(470 700) scale(.86)">
