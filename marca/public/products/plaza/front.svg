<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="PLAZA // NEGRO — FRENTE">

<defs>
  <radialGradient id="studio-plaza-front" cx="50%" cy="42%" r="75%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9E9E6"/>
  </radialGradient>
  <linearGradient id="black-plaza-front" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2a2a"/>
    <stop offset=".35" stop-color="#0A0A0A"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="lens-plaza-front" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#262626"/>
    <stop offset=".5" stop-color="#0d0d0d"/>
    <stop offset="1" stop-color="#030303"/>
  </linearGradient>
  <linearGradient id="smoke-plaza-front" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4a48"/>
    <stop offset="1" stop-color="#1c1c1b"/>
  </linearGradient>
  <linearGradient id="mirror-plaza-front" x1="0" y1="0" x2=".2" y2="1">
    <stop offset="0" stop-color="#f7f7f5"/>
    <stop offset=".42" stop-color="#b9b9b6"/>
    <stop offset=".5" stop-color="#6d6d6a"/>
    <stop offset=".62" stop-color="#cfcfcb"/>
    <stop offset="1" stop-color="#8d8d89"/>
  </linearGradient>
  <linearGradient id="silver-plaza-front" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f4f2"/>
    <stop offset=".45" stop-color="#9c9c98"/>
    <stop offset=".6" stop-color="#e2e2df"/>
    <stop offset="1" stop-color="#7d7d79"/>
  </linearGradient>
  <filter id="soft-plaza-front" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="28"/>
  </filter>
  <filter id="grain-plaza-front" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/>
  </filter>
</defs>
<rect width="1200" height="1500" fill="url(#studio-plaza-front)"/>

      <ellipse cx="600" cy="860" rx="420" ry="34" fill="#000" opacity=".16" filter="url(#soft-plaza-front)"/>
      <g transform="translate(600 700) scale(1.02)">
        
          <rect x="-448" y="-62" width="22" height="30" fill="#151515"/>
          <rect x="-418" y="-78" width="352" height="156" rx="10" fill="url(#lens-plaza-front)" stroke="url(#black-plaza-front)" stroke-width="40"/>
          <rect x="-462" y="-58" width="34" height="14" fill="url(#silver-plaza-front)"/>
          <path d="M -392 -70 L -100 -70" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>
        <g transform="scale(-1,1)">
          <rect x="-448" y="-62" width="22" height="30" fill="#151515"/>
          <rect x="-418" y="-78" width="352" height="156" rx="10" fill="url(#lens-plaza-front)" stroke="url(#black-plaza-front)" stroke-width="40"/>
          <rect x="-462" y="-58" width="34" height="14" fill="url(#silver-plaza-front)"/>
          <path d="M -392 -70 L -100 -70" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>
        </g>
        <path d="M -66 -46 Q 0 -60 66 -46" stroke="#0A0A0A" stroke-width="28" fill="none"/></g>

</svg>
