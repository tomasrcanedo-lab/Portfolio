<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="ANILLO SELLO // PLATA">

<defs>
  <radialGradient id="studio-anillo-sello" cx="50%" cy="42%" r="75%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9E9E6"/>
  </radialGradient>
  <linearGradient id="black-anillo-sello" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2a2a"/>
    <stop offset=".35" stop-color="#0A0A0A"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="lens-anillo-sello" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#262626"/>
    <stop offset=".5" stop-color="#0d0d0d"/>
    <stop offset="1" stop-color="#030303"/>
  </linearGradient>
  <linearGradient id="smoke-anillo-sello" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4a48"/>
    <stop offset="1" stop-color="#1c1c1b"/>
  </linearGradient>
  <linearGradient id="mirror-anillo-sello" x1="0" y1="0" x2=".2" y2="1">
    <stop offset="0" stop-color="#f7f7f5"/>
