<rect width="1200" height="1500" fill="url(#studio-anillo-sello)"/>

      <ellipse cx="600" cy="1000" rx="260" ry="30" fill="#000" opacity=".16" filter="url(#soft-anillo-sello)"/>
      <ellipse cx="600" cy="800" rx="200" ry="150" fill="none" stroke="url(#silver-anillo-sello)" stroke-width="54"/>
      <ellipse cx="600" cy="800" rx="200" ry="150" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="6"/>
      <rect x="470" y="560" width="260" height="170" rx="22" fill="url(#silver-anillo-sello)" stroke="#8d8d89" stroke-width="3"/>
