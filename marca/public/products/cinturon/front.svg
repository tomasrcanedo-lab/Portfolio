<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="CINTURÓN // NEGRO">

<defs>
  <radialGradient id="studio-cinturon" cx="50%" cy="42%" r="75%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9E9E6"/>
  </radialGradient>
  <linearGradient id="black-cinturon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a2a2a"/>
    <stop offset=".35" stop-color="#0A0A0A"/>
    <stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="lens-cinturon" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#262626"/>
    <stop offset=".5" stop-color="#0d0d0d"/>
    <stop offset="1" stop-color="#030303"/>
  </linearGradient>
  <linearGradient id="smoke-cinturon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a4a48"/>
    <stop offset="1" stop-color="#1c1c1b"/>
  </linearGradient>
  <linearGradient id="mirror-cinturon" x1="0" y1="0" x2=".2" y2="1">
    <stop offset="0" stop-color="#f7f7f5"/>
    <stop offset=".42" stop-color="#b9b9b6"/>
    <stop offset=".5" stop-color="#6d6d6a"/>
    <stop offset=".62" stop-color="#cfcfcb"/>
    <stop offset="1" stop-color="#8d8d89"/>
  </linearGradient>
  <linearGradient id="silver-cinturon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f4f2"/>
    <stop offset=".45" stop-color="#9c9c98"/>
    <stop offset=".6" stop-color="#e2e2df"/>
    <stop offset="1" stop-color="#7d7d79"/>
  </linearGradient>
  <filter id="soft-cinturon" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="28"/>
  </filter>
  <filter id="grain-cinturon" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/>
  </filter>
</defs>
<rect width="1200" height="1500" fill="url(#studio-cinturon)"/>

      <ellipse cx="600" cy="1010" rx="420" ry="30" fill="#000" opacity=".14" filter="url(#soft-cinturon)"/>
      <path d="M 120 760 C 300 700 520 900 760 780 L 1080 640" stroke="#111" stroke-width="86" fill="none"/>
      <path d="M 120 760 C 300 700 520 900 760 780 L 1080 640" stroke="#fff" stroke-opacity=".08" stroke-width="2" stroke-dasharray="12 10" fill="none" transform="translate(0 -30)"/>
      <path d="M 120 760 C 300 700 520 900 760 780 L 1080 640" stroke="#fff" stroke-opacity=".08" stroke-width="2" stroke-dasharray="12 10" fill="none" transform="translate(0 30)"/>
      <g transform="translate(700 800) rotate(-18)">
        <rect x="-90" y="-80" width="180" height="160" fill="none" stroke="url(#silver-cinturon)" stroke-width="22"/>
        <rect x="-8" y="-80" width="16" height="160" fill="url(#silver-cinturon)"/>
      </g>

</svg>
